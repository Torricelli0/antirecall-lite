<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撤回记录 · AntiRecall Lite</title>
<style>
/* ==========================================================================
   Design Tokens — 抽取自 DeepSeek 官网公开 CSS（www.deepseek.com）
   --------------------------------------------------------------------------
   这不是"猜的配色"，是从官方样式表里读出来的真实变量值。
   明暗两套都保留，方便跟随系统 / 手动切换。

   用法：在任何页面 <link> 引入本文件，然后用 var(--ds-*)。
   改风格时只改这里，不要散落在各组件里写死颜色。
   ========================================================================== */

:root {
  /* ── 品牌色 ───────────────────────────────────────────── */
  --ds-color-brand:              #4d6bfe;
  --ds-color-brand-light:        #6799fe;
  --ds-color-brand-deep:         #3a65c2;
  --ds-color-brand-medium-rev:   #4176e6;
  --ds-color-link-blue:          #234792;
  --ds-color-hero-join:          #2e609f;
  --ds-color-primary-bluish:     #152443;

  /* ── 间距：4px 基准网格 ────────────────────────────────── */
  --ds-space-1:   4px;
  --ds-space-2:   8px;
  --ds-space-3:  12px;
  --ds-space-4:  16px;
  --ds-space-5:  24px;
  --ds-space-6:  32px;
  --ds-space-7:  40px;
  --ds-space-8:  56px;
  --ds-space-9:  80px;
  --ds-space-10: 120px;
  --ds-space-11: 160px;
  --ds-space-12: 200px;
  --ds-space-13: 240px;

  /* ── 圆角 ─────────────────────────────────────────────── */
  --ds-radius-sm:     8px;
  --ds-radius-input: 10px;
  --ds-radius-media: 12px;
  --ds-radius-panel: 16px;
  --ds-radius-card:  24px;
  --ds-radius-pill: 100px;

  /* ── 字体 ─────────────────────────────────────────────── */
  --ds-font-display: "Host Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ds-font-body:    "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --ds-font-sans:    var(--ds-font-body);
  --ds-font-mono:    "Fragment Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* ── 动效 ─────────────────────────────────────────────── */
  --ds-ease:         cubic-bezier(.4, 0, .2, 1);
  --ds-duration-fast: 150ms;
  --ds-duration:      240ms;
  --ds-blur-glass:    12px;

  /* ── 亮色主题（默认）──────────────────────────────────── */
  --ds-bg-page:            #f7f8fa;          /* 页面底色：微冷灰，让白卡片浮起来 */
  --ds-bg-page-alt:        #f9f8f8;
  --ds-bg-surface-1:       #ffffff;          /* 卡片：纯白，不是半透明 */
  --ds-bg-surface-2:       #f4f6f9;          /* 内层/chip 底 */
  --ds-bg-surface-raised:  #ffffff;
  --ds-bg-hover:           rgba(0, 0, 0, .035);
  --ds-bg-input:           #ffffff;
  --ds-bg-code:            rgba(0, 0, 0, .045);
  --ds-bg-overlay:         #ffffff;
  --ds-bg-card-edge:       #e9edf3;          /* 卡片描边：官网 shadow 的第一层 */

  --ds-text-primary:       #1e232c;
  --ds-text-secondary:     rgba(32, 33, 36, .82);
  --ds-text-description:   rgba(32, 33, 36, .62);
  --ds-text-placeholder:   #8691a1;
  --ds-text-inverse:       #ffffff;

  --ds-border-subtle:      #e9edf3;
  --ds-border-default:     rgba(32, 33, 36, .16);
  --ds-border-divider:     rgba(32, 33, 36, .09);
  --ds-border-hover:       rgba(32, 33, 36, .28);
  --ds-border-strong:      rgba(0, 0, 0, .22);

  --ds-shadow-card:        0 0 0 1px #eef1f6, 0 2px 4px rgba(16,24,40,.04), 0 12px 24px rgba(16,24,40,.05);
  --ds-shadow-raised:      0 4px 12px rgba(16,24,40,.07), 0 20px 48px rgba(16,24,40,.09);

  --ds-btn-primary-bg:     #1a1615;
  --ds-btn-primary-text:   #ffffff;
  --ds-btn-ghost-text:     #121c31;
  --ds-btn-ghost-hover-bg: rgba(0, 0, 0, .04);

  /* 语义色：本项目的"已撤回"状态 */
  --ds-accent-warn:        #c2762a;
  --ds-accent-warn-bg:     rgba(194, 118, 42, .10);
  --ds-accent-warn-border: rgba(194, 118, 42, .28);
}

/* ── 深色主题 ───────────────────────────────────────────── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg-page:            #0a0a0a;
    --ds-bg-page-alt:        #111111;
    --ds-bg-surface-1:       hsla(0, 0%, 100%, .06);
    --ds-bg-surface-2:       hsla(0, 0%, 100%, .04);
    --ds-bg-surface-raised:  hsla(0, 0%, 100%, .25);
    --ds-bg-hover:           hsla(0, 0%, 100%, .06);
    --ds-bg-input:           hsla(0, 0%, 100%, .08);
    --ds-bg-code:            rgba(0, 0, 0, .35);
    --ds-bg-overlay:         #262626;

    --ds-text-primary:       #ffffff;
    --ds-text-secondary:     hsla(0, 0%, 100%, .8);
    --ds-text-description:   hsla(0, 0%, 100%, .56);
    --ds-text-placeholder:   hsla(0, 0%, 100%, .3);
    --ds-text-inverse:       #0a0a0a;

    --ds-border-subtle:      hsla(0, 0%, 100%, .08);
    --ds-border-default:     hsla(0, 0%, 100%, .10);
    --ds-border-divider:     hsla(0, 0%, 100%, .25);
    --ds-border-hover:       hsla(20, 1%, 45%, .2);
    --ds-border-strong:      hsla(0, 0%, 100%, .24);

    --ds-shadow-card:        hsla(0, 0%, 100%, .12) 0 1px 0 0 inset;
    --ds-shadow-raised:      0 12px 40px rgba(0,0,0,.5);

    --ds-btn-primary-bg:     #ffffff;
    --ds-btn-primary-text:   #0a0a0a;
    --ds-btn-ghost-text:     #ffffff;
    --ds-btn-ghost-hover-bg: hsla(0, 0%, 100%, .08);

    --ds-color-brand:        #6799fe;
    --ds-accent-warn:        #e8a45a;
    --ds-accent-warn-bg:     rgba(232, 164, 90, .13);
    --ds-accent-warn-border: rgba(232, 164, 90, .32);
  }
}

/* ── 手动强制亮色 ─────────────────────────────────────── */
:root[data-theme="light"] {
  --ds-bg-page:            #f7f8fa;
  --ds-bg-page-alt:        #f9f8f8;
  --ds-bg-surface-1:       #ffffff;
  --ds-bg-surface-2:       #f4f6f9;
  --ds-bg-surface-raised:  #ffffff;
  --ds-bg-hover:           rgba(0,0,0,.035);
  --ds-bg-input:           #ffffff;
  --ds-bg-code:            rgba(0,0,0,.045);
  --ds-bg-overlay:         #ffffff;
  --ds-bg-card-edge:       #e9edf3;

  --ds-text-primary:       #1e232c;
  --ds-text-secondary:     rgba(32,33,36,.82);
  --ds-text-description:   rgba(32,33,36,.62);
  --ds-text-placeholder:   #8691a1;
  --ds-text-inverse:       #ffffff;

  --ds-border-subtle:      #e9edf3;
  --ds-border-default:     rgba(32,33,36,.16);
  --ds-border-divider:     rgba(32,33,36,.09);
  --ds-border-hover:       rgba(32,33,36,.28);
  --ds-border-strong:      rgba(0,0,0,.22);

  --ds-shadow-card:        0 0 0 1px #eef1f6, 0 2px 4px rgba(16,24,40,.04), 0 12px 24px rgba(16,24,40,.05);
  --ds-shadow-raised:      0 4px 12px rgba(16,24,40,.07), 0 20px 48px rgba(16,24,40,.09);

  --ds-btn-primary-bg:     #1a1615;
  --ds-btn-primary-text:   #ffffff;
  --ds-btn-ghost-text:     #121c31;
  --ds-btn-ghost-hover-bg: rgba(0,0,0,.04);

  --ds-color-brand:        #4d6bfe;
  --ds-accent-warn:        #c2762a;
  --ds-accent-warn-bg:     rgba(194,118,42,.10);
  --ds-accent-warn-border: rgba(194,118,42,.28);
}

/* ── 手动强制深色（和 @media 里那份一致，这样按钮切换才生效）─── */
:root[data-theme="dark"] {
  --ds-bg-page:            #0a0a0a;
  --ds-bg-page-alt:        #111111;
  --ds-bg-surface-1:       hsla(0,0%,100%,.06);
  --ds-bg-surface-2:       hsla(0,0%,100%,.04);
  --ds-bg-surface-raised:  hsla(0,0%,100%,.25);
  --ds-bg-hover:           hsla(0,0%,100%,.06);
  --ds-bg-input:           hsla(0,0%,100%,.08);
  --ds-bg-code:            rgba(0,0,0,.35);
  --ds-bg-overlay:         #262626;
  --ds-bg-card-edge:       hsla(0,0%,100%,.09);

  --ds-text-primary:       #ffffff;
  --ds-text-secondary:     hsla(0,0%,100%,.8);
  --ds-text-description:   hsla(0,0%,100%,.56);
  --ds-text-placeholder:   hsla(0,0%,100%,.3);
  --ds-text-inverse:       #0a0a0a;

  --ds-border-subtle:      hsla(0,0%,100%,.08);
  --ds-border-default:     hsla(0,0%,100%,.10);
  --ds-border-divider:     hsla(0,0%,100%,.25);
  --ds-border-hover:       hsla(20,1%,45%,.2);
  --ds-border-strong:      hsla(0,0%,100%,.24);

  --ds-shadow-card:        hsla(0,0%,100%,.12) 0 1px 0 0 inset, 0 12px 32px rgba(0,0,0,.34);
  --ds-shadow-raised:      0 12px 40px rgba(0,0,0,.5);

  --ds-btn-primary-bg:     #ffffff;
  --ds-btn-primary-text:   #0a0a0a;
  --ds-btn-ghost-text:     #ffffff;
  --ds-btn-ghost-hover-bg: hsla(0,0%,100%,.08);

  --ds-color-brand:        #6799fe;
  --ds-accent-warn:        #e8a45a;
  --ds-accent-warn-bg:     rgba(232,164,90,.13);
  --ds-accent-warn-border: rgba(232,164,90,.32);
}

/* ── 基础重置（可选，按需使用）──────────────────────────── */
.ds-reset {
  font-family: var(--ds-font-body);
  color: var(--ds-text-primary);
  background: var(--ds-bg-page);
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}
.ds-transition { transition: all var(--ds-duration) var(--ds-ease); }

/* ───────────── 组件样式（只引用 tokens） ───────────── */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--ds-font-body);
  color:var(--ds-text-primary);
  background:var(--ds-bg-page);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
  transition:background var(--ds-duration) var(--ds-ease),
             color var(--ds-duration) var(--ds-ease);
}
button,input,select{font-family:inherit}

/* 顶栏：玻璃拟态 */
header{
  position:sticky;top:0;z-index:20;
  backdrop-filter:blur(var(--ds-blur-glass)) saturate(150%);
  -webkit-backdrop-filter:blur(var(--ds-blur-glass)) saturate(150%);
  background:color-mix(in srgb,var(--ds-bg-page) 82%,transparent);
  border-bottom:1px solid var(--ds-border-subtle);
  box-shadow:0 1px 0 color-mix(in srgb,var(--ds-border-subtle) 60%,transparent);
}
.bar{
  max-width:1040px;margin:0 auto;
  padding:var(--ds-space-4) var(--ds-space-6);
  display:flex;align-items:center;gap:var(--ds-space-3);flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:var(--ds-space-3);margin-right:var(--ds-space-2)}
.logo{
  width:28px;height:28px;border-radius:var(--ds-radius-sm);flex:none;
  background:var(--ds-color-brand);
  display:flex;align-items:center;justify-content:center;
  color:var(--ds-btn-primary-text);
  transition:background var(--ds-duration-fast) var(--ds-ease);
}
.logo svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;
          stroke-linecap:round;stroke-linejoin:round}
.brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.1px;
          font-family:var(--ds-font-display)}
.brand .sub{font-size:10px;color:var(--ds-text-placeholder);letter-spacing:1.2px;
            font-weight:600;margin-top:1px}
.pill{
  font-size:11.5px;color:var(--ds-text-secondary);
  background:var(--ds-bg-surface-1);
  padding:3px 11px;border-radius:var(--ds-radius-pill);
  border:1px solid var(--ds-border-subtle);white-space:nowrap;
}
.grow{flex:1}
.tools{display:flex;gap:var(--ds-space-2);align-items:center;flex-wrap:wrap}

input[type=search]{
  background:var(--ds-bg-surface-1);
  border:1px solid var(--ds-border-default);
  color:var(--ds-text-primary);
  padding:var(--ds-space-2) var(--ds-space-3);
  border-radius:var(--ds-radius-input);
  width:220px;outline:none;font-size:13px;
  transition:border-color var(--ds-duration-fast) var(--ds-ease),
             box-shadow var(--ds-duration-fast) var(--ds-ease);
}
input[type=search]::placeholder{color:var(--ds-text-placeholder)}
input[type=search]:focus{
  border-color:var(--ds-color-brand);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ds-color-brand) 14%,transparent);
}
select,button{
  background:var(--ds-bg-surface-1);
  border:1px solid var(--ds-border-default);
  color:var(--ds-text-secondary);
  padding:var(--ds-space-2) var(--ds-space-3);
  border-radius:var(--ds-radius-input);
  font-size:13px;cursor:pointer;outline:none;
  transition:background var(--ds-duration-fast) var(--ds-ease),
             border-color var(--ds-duration-fast) var(--ds-ease),
             color var(--ds-duration-fast) var(--ds-ease);
}
select:hover,button:hover{background:var(--ds-bg-hover);color:var(--ds-text-primary)}
button.primary{
  background:var(--ds-btn-primary-bg);
  border-color:transparent;
  color:var(--ds-btn-primary-text);
  font-weight:600;
}
button.primary:hover{opacity:.86;color:var(--ds-btn-primary-text)}
button.icon{
  width:34px;padding:var(--ds-space-2);display:flex;align-items:center;justify-content:center;
}
button.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
                stroke-linecap:round;stroke-linejoin:round}

/* 主体 */
main{max-width:1040px;margin:0 auto;padding:var(--ds-space-6) var(--ds-space-6) var(--ds-space-10)}

.notice{
  display:flex;gap:var(--ds-space-3);align-items:flex-start;
  background:var(--ds-bg-surface-1);
  border:1px solid var(--ds-border-subtle);
  border-radius:var(--ds-radius-panel);
  padding:var(--ds-space-4) var(--ds-space-5);
  margin-bottom:var(--ds-space-5);
  font-size:12.5px;color:var(--ds-text-description);
}
.notice .ic{
  flex:none;width:20px;height:20px;border-radius:var(--ds-radius-sm);
  background:color-mix(in srgb,var(--ds-color-brand) 12%,transparent);
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.notice .ic svg{width:12px;height:12px;stroke:var(--ds-color-brand);fill:none;stroke-width:2}
.notice b{color:var(--ds-text-secondary);font-weight:600}
.notice code{
  background:var(--ds-bg-code);border:1px solid var(--ds-border-subtle);
  color:var(--ds-accent-warn);padding:1px 6px;border-radius:var(--ds-radius-sm);
  font-size:11.5px;font-family:var(--ds-font-mono);
}
.notice .err{color:var(--ds-accent-warn)}

/* 统计条 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ds-space-3);
        margin-bottom:var(--ds-space-6)}
.stat{
  flex:1;min-width:120px;
  background:var(--ds-bg-surface-1);
  border:1px solid var(--ds-bg-card-edge);
  border-radius:var(--ds-radius-panel);
  padding:var(--ds-space-4) var(--ds-space-5);
  box-shadow:var(--ds-shadow-card);
  transition:border-color var(--ds-duration-fast) var(--ds-ease),
             box-shadow var(--ds-duration) var(--ds-ease),
             transform var(--ds-duration-fast) var(--ds-ease);
}
.stat:hover{
  border-color:var(--ds-border-default);
  box-shadow:var(--ds-shadow-raised);
  transform:translateY(-2px);
}
.stat .n{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.25;
         font-family:var(--ds-font-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--ds-text-description);margin-top:2px}

/* 记录卡片 */
.item{
  background:var(--ds-bg-surface-1);
  border:1px solid var(--ds-bg-card-edge);
  border-radius:var(--ds-radius-panel);
  padding:var(--ds-space-5);
  margin-bottom:var(--ds-space-4);
  box-shadow:var(--ds-shadow-card);
  transition:border-color var(--ds-duration-fast) var(--ds-ease),
             box-shadow var(--ds-duration) var(--ds-ease),
             transform var(--ds-duration-fast) var(--ds-ease);
}
.item:hover{
  border-color:var(--ds-border-default);
  box-shadow:var(--ds-shadow-raised);
  transform:translateY(-2px);
}

.meta{display:flex;gap:var(--ds-space-2);align-items:center;flex-wrap:wrap;
      margin-bottom:var(--ds-space-3)}
.chip{
  font-size:11px;padding:2.5px 10px;border-radius:var(--ds-radius-pill);
  border:1px solid var(--ds-border-subtle);
  color:var(--ds-text-secondary);background:var(--ds-bg-surface-2);
  white-space:nowrap;
}
.chip.recall{
  background:var(--ds-accent-warn-bg);
  border-color:var(--ds-accent-warn-border);
  color:var(--ds-accent-warn);font-weight:600;
}
.chip.type{
  background:color-mix(in srgb,var(--ds-color-brand) 10%,transparent);
  border-color:color-mix(in srgb,var(--ds-color-brand) 24%,transparent);
  color:var(--ds-color-brand);
}
.who{font-weight:600;font-size:13px;color:var(--ds-text-primary)}
.grow2{flex:1}
.time{font-size:11.5px;color:var(--ds-text-placeholder);
      font-variant-numeric:tabular-nums;margin-left:auto}

.body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.75}
.body.muted{color:var(--ds-text-description);font-style:italic;font-size:13px}

.media{margin-top:var(--ds-space-3);display:flex;flex-wrap:wrap;gap:var(--ds-space-2)}
.media img{
  max-width:240px;max-height:240px;
  border-radius:var(--ds-radius-media);
  border:1px solid var(--ds-border-subtle);
  background:var(--ds-bg-surface-2);
  cursor:zoom-in;
  transition:border-color var(--ds-duration-fast) var(--ds-ease),
             transform var(--ds-duration-fast) var(--ds-ease);
}
.media img:hover{border-color:var(--ds-color-brand);transform:scale(1.015)}
.media .filelink{
  display:inline-flex;align-items:center;gap:var(--ds-space-2);
  background:var(--ds-bg-surface-2);border:1px solid var(--ds-border-subtle);
  padding:var(--ds-space-2) var(--ds-space-3);
  border-radius:var(--ds-radius-input);
  font-size:12.5px;color:var(--ds-text-secondary);text-decoration:none;
  transition:background var(--ds-duration-fast) var(--ds-ease),
             border-color var(--ds-duration-fast) var(--ds-ease);
}
.media .filelink:hover{background:var(--ds-bg-hover);border-color:var(--ds-border-default);
                       color:var(--ds-text-primary)}
.media .filelink svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;
                     stroke-linecap:round;stroke-linejoin:round}

.empty-state{text-align:center;padding:var(--ds-space-11) var(--ds-space-6);
             color:var(--ds-text-description)}
.empty-state .glyph{
  width:52px;height:52px;margin:0 auto var(--ds-space-4);
  border-radius:var(--ds-radius-panel);
  background:var(--ds-bg-surface-1);border:1px solid var(--ds-border-subtle);
  display:flex;align-items:center;justify-content:center;
}
.empty-state .glyph svg{width:22px;height:22px;stroke:var(--ds-text-placeholder);
                        fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty-state .t{color:var(--ds-text-secondary);font-size:14.5px;font-weight:600;
                margin-bottom:var(--ds-space-2)}
.empty-state .d{font-size:12.5px}

footer{
  max-width:1040px;margin:0 auto;padding:var(--ds-space-6);
  text-align:center;color:var(--ds-text-placeholder);font-size:11.5px;
  border-top:1px solid var(--ds-border-subtle);
}
.kbd{
  display:inline-block;background:var(--ds-bg-surface-2);
  border:1px solid var(--ds-border-subtle);border-bottom-width:2px;
  border-radius:var(--ds-radius-sm);padding:0 5px;font-size:10.5px;
  font-family:var(--ds-font-mono);color:var(--ds-text-secondary);
}

.lightbox{
  position:fixed;inset:0;z-index:100;
  background:rgba(6,8,12,.92);
  display:none;align-items:center;justify-content:center;
  padding:var(--ds-space-7);backdrop-filter:blur(6px);
}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:var(--ds-radius-media);
              box-shadow:var(--ds-shadow-raised)}
@media (max-width:720px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .bar{padding:var(--ds-space-3) var(--ds-space-4)}
  input[type=search]{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </div>
      <div>
        <h1>撤回记录</h1>
        <div class="sub">ANTIRECALL LITE</div>
      </div>
    </div>
    <span class="pill" id="count">0 条</span>
    <span class="grow"></span>
    <div class="tools">
      <input type="search" id="q" placeholder="搜索内容 / 昵称…">
      <select id="kind">
        <option value="">全部</option>
        <option value="text">文本</option>
        <option value="image">图片</option>
        <option value="file">文件</option>
        <option value="video">视频</option>
        <option value="voice">语音</option>
        <option value="face">表情</option>
        <option value="mixed">混合</option>
      </select>
      <button id="reload" class="primary">刷新</button>
      <button id="theme" class="icon" title="切换明暗主题">
        <svg id="themeIcon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="notice" id="notice">
    <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
    <div id="noticeText">正在读取记录…</div>
  </div>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">总记录</div></div>
    <div class="stat"><div class="n" id="sText">0</div><div class="l">文本</div></div>
    <div class="stat"><div class="n" id="sMedia">0</div><div class="l">图片/文件</div></div>
    <div class="stat"><div class="n" id="sToday">0</div><div class="l">今天</div></div>
  </div>

  <div id="list"></div>
</main>

<footer>
  数据全程保存在本机 · 不联网、不上传 · <span class="kbd">⌘</span>+<span class="kbd">R</span> 刷新 · <span class="kbd">/</span> 搜索
</footer>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
(() => {
  'use strict';
  let all = [];
  const $ = id => document.getElementById(id);
  const listEl = $('list'), countEl = $('count'), noticeTextEl = $('noticeText');
  const statsEl = $('stats'), lightbox = $('lightbox'), lightboxImg = $('lightboxImg');

  const KIND_LABEL = { text:'文本', image:'图片', file:'文件', face:'表情',
                       voice:'语音', video:'视频', mixed:'混合', unknown:'其他' };

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const fmtSize = n => {
    const v = Number(n) || 0;
    if (!v) return '';
    if (v < 1024) return v + ' B';
    if (v < 1048576) return (v/1024).toFixed(1) + ' KB';
    return (v/1048576).toFixed(1) + ' MB';
  };

  /* ── 主题：跟随系统，可手动覆盖 ── */
  const prefersDark = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const forced = localStorage.getItem('arl-theme');   // 'light' | 'dark' | null
    const dark = forced === 'dark' || (forced === null && prefersDark.matches);

    // 关键：始终显式设置 data-theme。
    // 手动 dark 必须命中 :root[data-theme="dark"]，光靠 @media 不生效。
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

    $('themeIcon').innerHTML = dark
      ? '<path d="M20.4 14.6A8.5 8.5 0 0 1 9.4 3.6a8.5 8.5 0 1 0 11 11z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  }
  $('theme').addEventListener('click', () => {
    const cur = localStorage.getItem('arl-theme');
    const isDark = cur === 'dark' || (cur === null && prefersDark.matches);
    localStorage.setItem('arl-theme', isDark ? 'light' : 'dark');
    applyTheme();
  });
  prefersDark.addEventListener('change', applyTheme);
  applyTheme();

  function renderStats() {
    const today = new Date().toISOString().slice(0,10);
    $('sTotal').textContent = all.length;
    $('sText').textContent = all.filter(r => r.kind === 'text').length;
    $('sMedia').textContent = all.filter(r => ['image','file','video','mixed'].includes(r.kind)).length;
    $('sToday').textContent = all.filter(r => String(r.time||'').slice(0,10) === today).length;
    statsEl.style.display = all.length ? '' : 'none';
  }

  function mediaHtml(r) {
    const parts = (r.parts||[]).filter(p => p.type !== 'text' && p.type !== 'reply');
    if (!parts.length) return '';
    const cells = parts.map(p => {
      if (p.type === 'image') {
        return p.local
          ? '<img src="assets/images/' + encodeURIComponent(p.local) + '" alt="' +
            esc(p.fileName||'图片') + '" loading="lazy" data-zoom="1">'
          : '<span class="filelink">🖼 ' + esc(p.fileName||'图片') + '（未缓存）</span>';
      }
      if (p.type === 'file') {
        const size = fmtSize(p.fileSize);
        return p.local
          ? '<a class="filelink" href="assets/files/' + encodeURIComponent(p.local) +
            '" download="' + esc(p.fileName||'file') + '">' +
            '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>' +
            esc(p.fileName||'文件') + (size ? ' · ' + size : '') + '</a>'
          : '<span class="filelink">📎 ' + esc(p.fileName||'文件') + (size ? ' · ' + size : '') + '</span>';
      }
      if (p.type === 'video') {
        return p.local
          ? '<a class="filelink" href="assets/files/' + encodeURIComponent(p.local) +
            '" download>🎬 ' + esc(p.fileName||'视频') + '</a>'
          : '<span class="filelink">🎬 ' + esc(p.fileName||'视频') + '</span>';
      }
      if (p.type === 'voice') return '<span class="filelink">🎙 语音' + (p.duration ? ' ' + Math.round(p.duration)+'s' : '') + '</span>';
      if (p.type === 'face') return '<span class="filelink">😊 表情 #' + esc(p.faceIndex ?? '') + '</span>';
      return '';
    }).filter(Boolean);
    return cells.length ? '<div class="media">' + cells.join('') + '</div>' : '';
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const kind = $('kind').value;
    const rows = all.filter(r => {
      if (kind && r.kind !== kind) return false;
      if (!q) return true;
      const hay = [r.text, r.peer && r.peer.senderName, r.peer && r.peer.peerUin,
                   r.peer && r.peer.senderUin,
                   (r.parts||[]).map(p => p.fileName||p.content||'').join(' ')].join(' ').toLowerCase();
      return hay.includes(q);
    }).sort((a,b) => String(b.time||'').localeCompare(String(a.time||'')));

    countEl.textContent = rows.length + ' 条' + (rows.length !== all.length ? ' / 共 ' + all.length : '');
    renderStats();

    if (!rows.length) {
      listEl.innerHTML = '<div class="empty-state">' +
        '<div class="glyph"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></div>' +
        '<div class="t">' + (all.length ? '没有匹配的记录' : '还没有撤回记录') + '</div>' +
        '<div class="d">' + (all.length ? '换个关键词，或把筛选切回「全部」' : '收到撤回消息后，记录会自动出现在这里') + '</div>' +
      '</div>';
      return;
    }

    listEl.innerHTML = rows.map(r => {
      const who = (r.peer && (r.peer.senderName || r.peer.senderUin)) || '未知发送者';
      const pUin = (r.peer && r.peer.peerUin) || '';
      const chat = r.peer && r.peer.chatType === 2 ? '群聊' : r.peer && r.peer.chatType === 1 ? '私聊' : '会话';
      const body = r.text
        ? '<div class="body">' + esc(r.text) + '</div>'
        : '<div class="body muted">' + (r.kind === 'text' ? '（空消息）' : '（无文本内容）') + '</div>';
      return '<div class="item">' +
        '<div class="meta">' +
          '<span class="chip recall">已撤回</span>' +
          '<span class="chip type">' + esc(KIND_LABEL[r.kind]||r.kind) + '</span>' +
          '<span class="who">' + esc(who) + '</span>' +
          (pUin ? '<span class="chip">' + esc(pUin) + '</span>' : '') +
          '<span class="chip">' + esc(chat) + '</span>' +
          '<span class="time">' + esc(r.timeLocal||r.time||'') + '</span>' +
        '</div>' + body + mediaHtml(r) +
      '</div>';
    }).join('');
  }

  function parseJsonl(txt) {
    const out = [];
    for (const line of String(txt).split('\n')) {
      const t = line.trim();
      if (!t) continue;
      try { out.push(JSON.parse(t)); } catch {}
    }
    return out;
  }

  async function load() {
    try {
      const res = await fetch('recalled.jsonl?t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      all = parseJsonl(await res.text());
      $('notice').style.display = '';
      noticeTextEl.innerHTML = '<b>已读取 ' + all.length + ' 条记录</b>　·　本地目录 <code>…/data/anti_recall_lite/</code>';
      render();
    } catch (e) {
      $('notice').style.display = '';
      noticeTextEl.innerHTML = '<b class="err">无法读取记录（' + esc(e.message) + '）</b><br>' +
        '请通过插件内置地址访问：<code>http://127.0.0.1:8788/viewer.html</code>';
      render();
    }
  }

  $('q').addEventListener('input', render);
  $('kind').addEventListener('change', render);
  $('reload').addEventListener('click', load);
  addEventListener('keydown', e => {
    if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='r') { e.preventDefault(); load(); }
    if (e.key==='/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key==='Escape') lightbox.classList.remove('on');
  });
  listEl.addEventListener('click', e => {
    const img = e.target.closest('img[data-zoom]');
    if (!img) return;
    lightboxImg.src = img.src; lightbox.classList.add('on');
  });
  lightbox.addEventListener('click', () => lightbox.classList.remove('on'));

  load();
})();
</script>
</body>
</html>
